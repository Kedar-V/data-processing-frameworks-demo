[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataframe-engine-benchmark"
version = "0.1.0"
description = "A teaching-first MovieLens comparison of dataframe execution engines"
requires-python = ">=3.11"
dependencies = [
    "black[jupyter]",
    "ipykernel",
    "jupyter",
    "matplotlib",
    "pandas",
    "polars",
    "pyarrow",
    "pyspark",
    "seaborn",
]

[tool.setuptools]
packages = []
